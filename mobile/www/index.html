<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mezon</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: #0B1E22; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .logo { width: 84px; height: 84px; }
        h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: -0.02em; }
        p { margin: 0; color: #A7BCC0; font-size: 14px; }
        .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 18px; }
        .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #2DD4BF; border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
</head>
<body>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="mz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0F766E"/></linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#mz)"/>
        <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 15v32M22 48h20M14 21h36M14 21l-6 13M14 21l6 13M50 21l-6 13M50 21l6 13"/>
        </g>
        <g fill="#fff"><path d="M7 34h14a7 7 0 0 1-14 0zM43 34h14a7 7 0 0 1-14 0z"/><circle cx="32" cy="14" r="3"/></g>
    </svg>
    <h1>Mezon</h1>
    <p>Yuklanmoqda...</p>
    <div class="bar"></div>
</body>
</html>
